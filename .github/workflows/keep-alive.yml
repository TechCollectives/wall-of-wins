# Free Supabase projects pause after 7 days without traffic (eng review R1 / D4).
# One tiny anonymous read every 3 days keeps the wall and old links working.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 13 */3 * *' # ~9am New York, every 3 days
  workflow_dispatch: # run by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row with the public anon key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = 200
